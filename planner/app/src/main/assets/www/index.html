<!doctype html>
<html lang="ru" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Планёр</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg class="crown" viewBox="0 0 64 48" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3a1"/><stop offset="1" stop-color="#b8862b"/></linearGradient></defs><path d="M8 40 L4 12 L20 24 L32 4 L44 24 L60 12 L56 40 Z" fill="url(#cg)"/><rect x="8" y="41" width="48" height="5" rx="1.5" fill="url(#cg)"/><circle cx="32" cy="30" r="3.2" fill="#b0294a"/><circle cx="20" cy="33" r="2.2" fill="#2f8f6b"/><circle cx="44" cy="33" r="2.2" fill="#2f8f6b"/></svg>
      <div class="brand-t">
        <div id="title">Планёр</div>
        <div id="subtitle"></div>
      </div>
    </div>
    <div id="tnav"></div>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-act="nav" data-tab="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>День</span></button>
    <button data-act="nav" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M8 4v16M13 4v16M3 9h18"/></svg><span>Неделя</span></button>
    <button data-act="nav" data-tab="month"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/><circle cx="8" cy="14.5" r=".9"/><circle cx="12" cy="14.5" r=".9"/><circle cx="16" cy="14.5" r=".9"/><circle cx="8" cy="18" r=".9"/></svg><span>Месяц</span></button>
    <button data-act="nav" data-tab="year"><svg viewBox="0 0 24 24"><path d="M4 18 L3 7 L8.5 11 L12 4 L15.5 11 L21 7 L20 18 Z"/><path d="M4 21h16"/></svg><span>Год</span></button>
    <button data-act="nav" data-tab="fin"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>Казна</span></button>
    <button data-act="nav" data-tab="more"><svg viewBox="0 0 24 24"><path d="M12 2l2.2 4.5L19 7.2l-3.5 3.4.8 4.9L12 13.2l-4.3 2.3.8-4.9L5 7.2l4.8-.7z"/><path d="M12 15v7"/></svg><span>Ещё</span></button>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="finance.js"></script>
<script src="app.js"></script>
</body>
</html>
