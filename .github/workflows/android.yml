name: Сборка APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fantasy-map-apk
  cancel-in-progress: true

jobs:
  build:
    name: Собрать и опубликовать APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Определить версию
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Юнит-тесты
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Сборка release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Подготовить файл
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/fantasy-map-${VERSION_NAME}.apk"
          ls -la dist

      - name: Загрузить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-map-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Отчёт о тестах (при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Опубликовать релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/*.apk \
            --title "Фэнтези-карты ${VERSION_NAME}" \
            --notes "APK для установки на Android. Скачайте файл и откройте его на телефоне." \
            || gh release upload "${GITHUB_REF#refs/tags/}" dist/*.apk --clobber

      - name: Обновить сборку «latest»
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fantasy-map-latest --yes --cleanup-tag || true
          gh release create fantasy-map-latest dist/*.apk \
            --target "${GITHUB_SHA}" \
            --title "Фэнтези-карты — последняя сборка" \
            --notes "Приложение для рисования карт фэнтезийных миров.

          Скачайте APK ниже и откройте файл на Android-телефоне, чтобы установить.
          Сборка ${VERSION_NAME} из ветки \`${GITHUB_REF#refs/heads/}\`."
