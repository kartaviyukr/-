name: Сборка DuoQuest APK

on:
  push:
    branches:
      - claude/cross-platform-task-quest-app-i4mzto
  workflow_dispatch:

permissions:
  contents: write

# Одновременно идёт только одна сборка: иначе два запуска спорят за релиз.
concurrency:
  group: duoquest-apk
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duoquest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm install --legacy-peer-deps

      # Приводит версии пакетов к тем, что совместимы с установленным Expo SDK.
      - name: Выровнять версии пакетов под Expo SDK
        run: npx expo install --fix
        continue-on-error: true

      - name: Сгенерировать нативный проект
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Собрать APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Переименовать файл
        run: cp android/app/build/outputs/apk/release/app-release.apk duoquest.apk

      - name: Загрузить как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: duoquest-apk
          path: duoquest/duoquest.apk

      - name: Опубликовать в релизе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Одноразовая уборка после прошлой схемы с нумерованными тегами.
          gh release delete apk-3 --yes --cleanup-tag || true

          gh release delete duoquest-latest --yes --cleanup-tag || true
          gh release create duoquest-latest duoquest.apk \
            --target "${{ github.sha }}" \
            --title "DuoQuest — последняя сборка" \
            --notes "Задания, дедлайны, награды и наказания для двоих в виде RPG. Скачайте duoquest.apk на телефон и откройте файл, чтобы установить. Сборка ${{ github.run_number }}."

  typecheck:
    name: Проверка типов
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duoquest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
