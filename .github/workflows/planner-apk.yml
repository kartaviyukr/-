name: Скипетр APK

on:
  push:
    branches: ['**']
    paths:
      - 'planner/**'
      - '.github/workflows/planner-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Одновременно идёт только одна сборка: иначе два запуска спорят за релиз.
concurrency:
  group: skipetr-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # По умолчанию действие ставит пакет 'tools', которого в SDK больше нет,
          # и падает на нём. Платформу и build-tools дотянет сам Gradle.
          packages: ''

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download fonts (Cormorant Garamond, Montserrat)
        run: |
          cd app/src/main/assets/www/fonts
          base=https://cdn.jsdelivr.net/npm/@fontsource
          for sub in cyrillic latin; do
            for w in 500 600 700; do for st in normal italic; do
              curl -fsSL -o cormorant-garamond-$sub-$w-$st.woff2 $base/cormorant-garamond/files/cormorant-garamond-$sub-$w-$st.woff2 || true
            done; done
            for w in 400 500 600 700; do
              curl -fsSL -o montserrat-$sub-$w-normal.woff2 $base/montserrat/files/montserrat-$sub-$w-normal.woff2 || true
            done
          done
          ls -la

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Skipetr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skipetr-apk
          path: planner/Skipetr.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete skipetr-latest --yes --cleanup-tag || true
          gh release create skipetr-latest Skipetr.apk \
            --target "${{ github.sha }}" \
            --title "Скипетр — последняя сборка" \
            --notes "👑 Королевский личный планер: день, неделя, месяц, год. Скачайте Skipetr.apk на телефон и откройте файл, чтобы установить. Сборка ${{ github.run_number }}."
