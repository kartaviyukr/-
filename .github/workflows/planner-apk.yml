name: Скипетр APK

on:
  push:
    branches: ['**']
    paths:
      - 'planner/**'
      - '.github/workflows/planner-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download fonts (Cormorant Garamond, Montserrat)
        run: |
          cd app/src/main/assets/www/fonts
          base=https://cdn.jsdelivr.net/npm/@fontsource
          for sub in cyrillic latin; do
            for w in 500 600 700; do for st in normal italic; do
              curl -fsSL -o cormorant-garamond-$sub-$w-$st.woff2 $base/cormorant-garamond/files/cormorant-garamond-$sub-$w-$st.woff2 || true
            done; done
            for w in 400 500 600 700; do
              curl -fsSL -o montserrat-$sub-$w-normal.woff2 $base/montserrat/files/montserrat-$sub-$w-normal.woff2 || true
            done
          done
          ls -la

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Skipetr.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Skipetr-apk
          path: planner/Skipetr.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skipetr-v1.0-${{ github.run_number }}
          name: Скипетр 1.0 (сборка ${{ github.run_number }})
          body: |
            👑 Скипетр — королевский личный планер.
            Скачайте файл Skipetr.apk на телефон и установите его.
          files: planner/Skipetr.apk
