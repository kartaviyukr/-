name: Веб-версия DuoQuest (PWA)

on:
  push:
    branches:
      - claude/cross-platform-task-quest-app-i4mzto
    paths:
      - 'duoquest/**'
      - '.github/workflows/duoquest-web.yml'
  workflow_dispatch:

# Публикуем через ветку gh-pages: создать сам сайт Pages через API GITHUB_TOKEN
# не может («Resource not accessible by integration»), а запушить ветку — вполне.
permissions:
  contents: write

# Публикация страницы одна на репозиторий: параллельные деплои отменять нельзя,
# иначе сайт может остаться в промежуточном состоянии.
concurrency:
  group: duoquest-pages
  cancel-in-progress: false

jobs:
  build:
    name: Собрать PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duoquest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm install --legacy-peer-deps

      - name: Выровнять версии пакетов под Expo SDK
        run: npx expo install --fix
        continue-on-error: true

      - name: Собрать статику
        env:
          # Сайт лежит в подпапке репозитория, а не в корне домена.
          EXPO_PUBLIC_BASE_URL: /-/duoquest
        run: npx expo export --platform web --output-dir dist

      # В SPA-режиме Expo берёт свой шаблон HTML и игнорирует app/+html.tsx,
      # поэтому теги установки на домашний экран дописываются после экспорта.
      - name: Дописать PWA-теги
        run: node scripts/pwa-postbuild.mjs dist /-/duoquest

      - name: Проверить, что теги на месте
        run: |
          grep -q 'apple-mobile-web-app-capable' dist/index.html
          grep -q 'rel="manifest"' dist/index.html
          grep -q 'apple-touch-icon' dist/index.html
          echo "PWA-теги на месте"

      - name: Разложить под адрес /-/duoquest/
        run: |
          mkdir -p ../_site/duoquest
          cp -r dist/* ../_site/duoquest/
          # Корень репозитория на Pages свободен — уводим с него на приложение.
          cat > ../_site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>DuoQuest</title>
          <meta http-equiv="refresh" content="0; url=./duoquest/">
          <a href="./duoquest/">Открыть DuoQuest</a>
          HTML
          ls -R ../_site | head -30

      - name: Опубликовать в ветку gh-pages
        working-directory: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Без .nojekyll Pages прогонит сайт через Jekyll, а тот выбрасывает
          # каталоги, начинающиеся с подчёркивания — то есть весь _expo с бандлом.
          touch .nojekyll

          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Веб-версия DuoQuest, сборка ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Адрес приложения
        run: |
          echo "### Веб-версия опубликована" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://kartaviyukr.github.io/-/duoquest/" >> "$GITHUB_STEP_SUMMARY"
