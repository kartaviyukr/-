name: Сборка Android APK

on:
  push:
    branches: ['**']
    paths:
      - 'duoquest/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Опубликовать APK в Releases (чтобы скачать по прямой ссылке с телефона)'
        type: boolean
        default: true

# Нужно, чтобы шаг публикации мог создать релиз.
permissions:
  contents: write

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duoquest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm install --legacy-peer-deps

      # Приводит версии пакетов к тем, что совместимы с установленным Expo SDK.
      - name: Выровнять версии пакетов под Expo SDK
        run: npx expo install --fix
        continue-on-error: true

      - name: Сгенерировать нативный проект
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Собрать release APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/DuoQuest-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Выложить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: DuoQuest-APK
          path: duoquest/out/*.apk
          retention-days: 90

      - name: Опубликовать в Releases
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DuoQuest APK (сборка ${{ github.run_number }})
          body: |
            Установочный файл для Android.

            **Как поставить:** скачайте `.apk` на телефон, откройте его и разрешите
            установку из этого источника, когда Android спросит.

            Коммит: ${{ github.sha }}
          files: duoquest/out/*.apk
          prerelease: true

  typecheck:
    name: Проверка типов
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duoquest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
