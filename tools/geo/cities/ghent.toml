# Ghent — the first Tower War city.
# Geometry and OSM lookups only; balance lives in game/data/maps/ghent/.
# Coordinates are never written here: every landmark is resolved from OSM.

[city]
id = "ghent"
name_key = "MAP_GHENT"

[area]
# Whole municipality of Ghent (~156 km², includes the port in the north).
name = "Gent"
admin_level = 8
country_code = "BE"

[source]
overpass_url = "https://overpass-api.de/api/interpreter"
# Fallback when Overpass is unreachable: clipped with osmium to the area above.
pbf_url = "https://download.geofabrik.de/europe/belgium-latest.osm.pbf"

[projection]
crs = "EPSG:31370"           # Belgian Lambert 72
pixels_per_meter = 0.5       # [tuning] base zoom: 1 px = 2 m

[territories]
min_count = 60               # [tuning]
max_count = 80               # [tuning]
min_shared_border_m = 40     # [tuning] shorter shared borders do not make neighbours
center_ring_ref = "R40"      # inner ring road: territories inside are smallest

[game]
crown_towers = ["belfort", "sint_baafs", "sint_niklaas"]
ascension_site = "boekentoren"

[game.starts]
iron_syndicate = "gent_sint_pieters"
sky_weavers = "airfield"
harbor_brotherhood = "port"
shadow_coven = "sint_baafsabdij"
order_of_the_lamb = "sint_pietersabdij"

# ---------------------------------------------------------------- landmarks
# match.names: any of these OSM name / name:nl values (exact, case-insensitive)
# match.tags:  optional filters; a feature must carry one of the listed values

[[landmarks]]
id = "gravensteen"
name_key = "LM_GRAVENSTEEN"
archetype = "castle"
match = { names = ["Gravensteen", "Het Gravensteen"], tags = { historic = ["castle"] } }

[[landmarks]]
id = "belfort"
name_key = "LM_BELFORT"
archetype = "tower"
match = { names = ["Belfort van Gent", "Belfort", "Belfort en Lakenhalle"] }

[[landmarks]]
id = "sint_baafs"
name_key = "LM_SINT_BAAFS"
archetype = "cathedral"
match = { names = ["Sint-Baafskathedraal"] }

[[landmarks]]
id = "sint_niklaas"
name_key = "LM_SINT_NIKLAAS"
archetype = "church"
match = { names = ["Sint-Niklaaskerk"], tags = { amenity = ["place_of_worship"], building = ["church", "yes"] } }

[[landmarks]]
id = "sint_michielsbrug"
name_key = "LM_SINT_MICHIELSBRUG"
archetype = "bridge"
