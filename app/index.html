<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="description" content="Игровая подготовка к ЕГЭ по русскому языку: путь к замку, опыт, монеты и свой город">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ЕГЭ Квест">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>ЕГЭ Квест · Русский язык</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="tb-avatar" aria-label="Профиль">🦊</button>
      <div class="tb-xp">
        <div class="tb-row"><span class="lvl-badge tb-level">1</span><span class="tb-title">Новичок</span><span class="tb-xptext"></span></div>
        <div class="tb-xpbar"><i></i></div>
      </div>
      <div class="tb-streak" title="Дней подряд">🔥<b>0</b></div>
      <button class="tb-coins" aria-label="Монеты"><i class="coin"></i><b>0</b></button>
    </header>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-tab="map" class="on"><span>🗺️</span>Путь</button>
      <button data-tab="city"><span>🏙️</span>Город</button>
      <button data-tab="profile"><span>👤</span>Профиль</button>
    </nav>
  </div>
  <section id="lesson" class="lesson hidden"></section>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <canvas id="confetti"></canvas>
  <script src="js/markup.js"></script>
  <script src="js/app.js"></script>
  <script src="js/task17.js"></script>
  <script>App.start();</script>
</body>
</html>
